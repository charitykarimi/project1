<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Text Preview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="editor">

        <h1>Live Text Preview</h1>

        <textarea id="textInput" placeholder="Start typing something stunning..."></textarea>

        <div class="stats">
            <span id="characters">0 Characters</span>
            <span id="words">0 Words</span>
        </div>

    </div>

    <div class="preview-box">

        <h2>Preview</h2>

        <div id="preview">
            Your live text will appear here...
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
